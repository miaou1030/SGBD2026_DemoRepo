name: Build and test

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DemoRepo.slnx

      - name: Build
        run: dotnet build DemoRepo.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DemoRepo.slnx --configuration Release --no-build --no-restore
